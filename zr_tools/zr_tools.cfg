# =====================================================================
#  zr_tools.cfg  -  helper macros for the "ZR Tools" KlipperScreen panel
#  WonderMaker ZR Ultra-S (WonderMaker Klipper fork)          version 1
#
#  Install: copy to ~/printer_data/config/ and add to printer.cfg:
#      [include zr_tools.cfg]
#  Uses the existing [save_variables] file (saved_variables.cfg).
# =====================================================================

# ---------------------------------------------------------------------
#  Filament info per PHYSICAL toolhead (0-3)
#    T     = toolhead 0-3
#    COLOR = colour as decimal integer (0xRRGGBB), e.g. 16711680 = red
#    HEX   = colour as hex text RRGGBB (alternative to COLOR)
#    MAT   = material index (see ZR Tools panel list, 0 = Empty)
#    TEMP  = nozzle temperature for this filament
#  Example: ZR_SET_TOOL_INFO T=1 HEX=FF0000 MAT=1 TEMP=215
# ---------------------------------------------------------------------
[gcode_macro ZR_SET_TOOL_INFO]
description: Store filament colour/material/temperature for a toolhead
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        { action_raise_error("ZR_SET_TOOL_INFO: T must be 0-3") }
    {% endif %}
    {% if params.COLOR is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_color VALUE={params.COLOR|int}
    {% elif params.HEX is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_color VALUE={params.HEX|string|int(0, 16)}
    {% endif %}
    {% if params.MAT is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_mat VALUE={params.MAT|int}
    {% endif %}
    {% if params.TEMP is defined %}
        SAVE_VARIABLE VARIABLE=zr_t{t}_temp VALUE={params.TEMP|int}
    {% endif %}

# ---------------------------------------------------------------------
#  Per-toolhead pressure advance
#    ZR_SET_TOOL_PA T=0 PA=0.035   (saved, and applied now)
#  Uses WonderMaker's own variables t0_pressure_advance ... t3_...
# ---------------------------------------------------------------------
[gcode_macro ZR_SET_TOOL_PA]
description: Save (and apply) pressure advance for a toolhead
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set pa = params.PA|default(-1)|float %}
    {% if t < 0 or t > 3 or pa < 0 or pa > 1 %}
        { action_raise_error("ZR_SET_TOOL_PA: need T=0-3 and PA=0-1") }
    {% endif %}
    SAVE_VARIABLE VARIABLE=t{t}_pressure_advance VALUE={pa}
    SET_PRESSURE_ADVANCE EXTRUDER={'extruder' if t == 0 else 'extruder' ~ t} ADVANCE={pa}

# Called by the tool change (after the change_macros.cfg patch) instead
# of the hard-coded "ADVANCE=0.04". Falls back to 0.04 if nothing saved.
[gcode_macro _ZR_APPLY_TOOL_SETTINGS]
gcode:
    {% set t = params.T|int %}
    {% set v = printer.save_variables.variables %}
    {% set key = 't%d_pressure_advance' % t %}
    {% set pa = v[key]|float if key in v else 0.04 %}
    SET_PRESSURE_ADVANCE EXTRUDER={'extruder' if t == 0 else 'extruder' ~ t} ADVANCE={pa}

# ---------------------------------------------------------------------
#  Tool mapping: which PHYSICAL toolhead prints slicer tool T0-T3.
#  WonderMaker's T0-T3 macros already follow box_modify_t0..t3.
#  NOTE: WonderMaker resets the mapping to 1:1 at PRINT_END and
#  CANCEL_PRINT, so set it right before starting a print.
#    ZR_MAP_TOOL T=0 H=2   -> slicer T0 prints with toolhead 2
# ---------------------------------------------------------------------
[gcode_macro ZR_MAP_TOOL]
description: Map slicer tool T to physical toolhead H
gcode:
    {% set t = params.T|default(-1)|int %}
    {% set h = params.H|default(-1)|int %}
    {% if t < 0 or t > 3 or h < 0 or h > 3 %}
        { action_raise_error("ZR_MAP_TOOL: need T=0-3 and H=0-3") }
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("ZR_MAP_TOOL: not allowed during a print") }
    {% endif %}
    SAVE_VARIABLE VARIABLE=box_modify_t{t} VALUE={h}
    RESPOND MSG="Slicer T{t} -> toolhead {h}"

[gcode_macro ZR_MAP_RESET]
description: Reset tool mapping to 1:1 (T0->0, T1->1, ...)
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("ZR_MAP_RESET: not allowed during a print") }
    {% endif %}
    {% for i in range(4) %}
        SAVE_VARIABLE VARIABLE=box_modify_t{i} VALUE={i}
    {% endfor %}
    RESPOND MSG="Tool mapping reset to 1:1"

# ---------------------------------------------------------------------
#  Purge the ACTIVE toolhead at WonderMaker's purge spot (same moves
#  the original screen app used after a filament runout).
#    ZR_PURGE [LENGTH=100] [TEMP=...] [WIPE=1]
# ---------------------------------------------------------------------
[gcode_macro ZR_PURGE]
description: Purge filament from the active toolhead
gcode:
    {% set ext = printer.toolhead.extruder %}
    {% set length = params.LENGTH|default(100)|float %}
    {% set cur = printer[ext].target|float %}
    {% set temp = params.TEMP|default(cur if cur >= 170 else 220)|float %}
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("ZR_PURGE: not allowed while printing") }
    {% endif %}
    SAVE_GCODE_STATE NAME=zr_purge
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={ext} MINIMUM={temp - 3}
    G90
    G1 X-13 Y80 F6000
    M83
    G1 E{length} F400
    G1 E-2 F1800
    {% if params.WIPE|default(1)|int == 1 %}
        WIPE_NOZZLE
    {% endif %}
    RESTORE_GCODE_STATE NAME=zr_purge

# ---------------------------------------------------------------------
#  Chamber helpers (Ultra-S)
# ---------------------------------------------------------------------
[gcode_macro ZR_CHAMBER]
description: Set chamber temperature (0 = off). ZR_CHAMBER S=50
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 65 %}
        { action_raise_error("ZR_CHAMBER: maximum 65C") }
    {% endif %}
    M141 S{s}

[gcode_macro ZR_AIR_FILTER]
description: Air filter fan on/off. ZR_AIR_FILTER S=1 (needs air_filter=1 in tmt1.ini)
gcode:
    SET_FAN_SPEED FAN=air_fan SPEED={1 if params.S|default(1)|int == 1 else 0}

# ---------------------------------------------------------------------
#  Load / unload a PHYSICAL toolhead at its saved filament temperature
#  (WonderMaker's LOAD/UNLOAD_FILAMENT always heat to 220C and follow
#  the tool mapping; these always use the toolhead you choose.)
#    ZR_LOAD T=0 [TEMP=...] [LENGTH=100]
#    ZR_UNLOAD T=0 [TEMP=...]
#    ZR_RETRACT T=0 [TEMP=...]   (Unload button without an ACE: picks up the tool, heats, runs RETRACT_FILAMENT)
# ---------------------------------------------------------------------
[gcode_macro ZR_LOAD]
description: Load filament into toolhead T at its saved temperature
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        { action_raise_error("ZR_LOAD: T must be 0-3") }
    {% endif %}
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("ZR_LOAD: not allowed while printing") }
    {% endif %}
    {% set ext = 'extruder' if t == 0 else 'extruder' ~ t %}
    {% set prev = printer.toolhead.extruder %}
    {% set v = printer.save_variables.variables %}
    {% set key = 'zr_t%d_temp' % t %}
    {% set saved = v[key]|int if key in v else 0 %}
    {% set temp = params.TEMP|default(saved if saved >= 180 else 220)|float %}
    {% set length = params.LENGTH|default(100)|float %}
    SAVE_GCODE_STATE NAME=zr_load
    ACTIVATE_EXTRUDER EXTRUDER={ext}
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={ext} MINIMUM={temp - 3}
    M83
    G1 E{length} F400
    M400
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
    SET_STEPPER_ENABLE STEPPER={ext} ENABLE=0
    ACTIVATE_EXTRUDER EXTRUDER={prev}
    RESTORE_GCODE_STATE NAME=zr_load

[gcode_macro ZR_RETRACT]
description: Unload without an ACE: pick up toolhead T, heat it to its saved temperature, run WonderMaker's RETRACT_FILAMENT, heater off
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        { action_raise_error("ZR_RETRACT: T must be 0-3") }
    {% endif %}
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("ZR_RETRACT: not allowed while printing") }
    {% endif %}
    {% if "gcode_macro RETRACT_FILAMENT" not in printer %}
        { action_raise_error("ZR_RETRACT: this printer has no RETRACT_FILAMENT macro") }
    {% endif %}
    {% set ext = 'extruder' if t == 0 else 'extruder' ~ t %}
    {% set v = printer.save_variables.variables %}
    {% set key = 'zr_t%d_temp' % t %}
    {% set saved = v[key]|int if key in v else 0 %}
    {% set temp = params.TEMP|default(saved if saved >= 180 else 220)|float %}
    {% if printer.toolhead.extruder != ext %}
        _CHANGE_TOOL T={t}
    {% endif %}
    SAVE_GCODE_STATE NAME=zr_retract
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={ext} MINIMUM={temp - 3}
    RETRACT_FILAMENT
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
    RESTORE_GCODE_STATE NAME=zr_retract

[gcode_macro ZR_UNLOAD]
description: Unload filament from toolhead T at its saved temperature
gcode:
    {% set t = params.T|default(-1)|int %}
    {% if t < 0 or t > 3 %}
        { action_raise_error("ZR_UNLOAD: T must be 0-3") }
    {% endif %}
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("ZR_UNLOAD: not allowed while printing") }
    {% endif %}
    {% set ext = 'extruder' if t == 0 else 'extruder' ~ t %}
    {% set prev = printer.toolhead.extruder %}
    {% set v = printer.save_variables.variables %}
    {% set key = 'zr_t%d_temp' % t %}
    {% set saved = v[key]|int if key in v else 0 %}
    {% set temp = params.TEMP|default(saved if saved >= 180 else 220)|float %}
    SAVE_GCODE_STATE NAME=zr_unload
    ACTIVATE_EXTRUDER EXTRUDER={ext}
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={ext} MINIMUM={temp - 3}
    M83
    G1 E2 F400
    G1 E-45 F600
    M400
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
    SET_STEPPER_ENABLE STEPPER={ext} ENABLE=0
    ACTIVATE_EXTRUDER EXTRUDER={prev}
    RESTORE_GCODE_STATE NAME=zr_unload
