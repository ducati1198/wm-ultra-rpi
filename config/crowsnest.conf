# crowsnest webcam config (template). Edit the device line for your camera:  ls /dev/v4l/by-id/
[crowsnest]
log_path: ~/printer_data/logs/crowsnest.log
log_level: verbose
delete_log: false
no_proxy: false

[cam 1]
mode: ustreamer
enable_rtsp: false
rtsp_port: 8554
port: 8080
device: /dev/video0
resolution: 1280x720
max_fps: 15
