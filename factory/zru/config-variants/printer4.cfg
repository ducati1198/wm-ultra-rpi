[probe]               
pin:!PB6
x_offset:0
y_offset:0
# z_offset:0
speed:3.6
lift_speed:3
samples: 2
samples_result: average #median
sample_retract_dist:0.85
samples_tolerance: 0.02 
samples_tolerance_retries: 3
activate_gcode:
    SET_VELOCITY_LIMIT ACCEL=14
    _LEVELING_TRIGGER
deactivate_gcode:
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}


[save_variables] 
