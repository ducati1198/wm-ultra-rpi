[verify_heater heater_bed]
max_error: 120
check_gain_time: 120   #120
hysteresis: 10
heating_gain: 2


[fan]
pin:EX_T:PB7
kick_start_time: 0.5
off_below: 0.0
cycle_time: 0.00003
tachometer_pin:^EX_T:PB6


[fan_generic auxiliary_fan]
pin:PC7
tachometer_pin:PC6
tachometer_ppr:2
shutdown_speed:0
tachometer_poll_interval: 0.0001

[controller_fan motherboard_fan]
pin:PA8
max_power:0.5
shutdown_speed: 0
stepper:stepper_x,stepper_y,stepper_z
idle_timeout:60
idle_speed:0    

[gcode_macro z_rise]
gcode:
    {% if "z" in printer.toolhead.homed_axes and printer.toolhead.position.z < 3 and printer.query_endstops.last_query.z==0 %}
        G91 
        G1 Z3 F1200
        G90
    {%  elif "z" not in printer.toolhead.homed_axes and printer.query_endstops.last_query.z==0 %}
        SET_KINEMATIC_POSITION Z=3
        G91 
        G1 Z3 F1200
        G90
    {% endif %}

[homing_override]
axes: xyz
gcode:
    QUERY_ENDSTOPS
    z_rise

    {% set current_extruder = printer.save_variables.variables.current_extruder %}
    {% if current_extruder == 99 %}
        SAVE_VARIABLE VARIABLE=unlock_hall VALUE={printer.custom_hall.Raw}
    {% endif %}

    {% set targe_temprature = printer.extruder.target %}

    {% if params.X is defined and params.Y is undefined and params.Z is undefined %} #X
        G28 X 
    {% endif %}

    {% if params.Y is defined and params.X is undefined and params.Z is undefined %} #Y
        G28 Y 
    {% endif %}

    {% if params.X is undefined and params.Y is undefined and params.Z is defined %} #Z
        _LEVELING_TRIGGER_S
        M400
        STEPPER_DIAG_ENABLE CHIP="stepper_z"
        M118 Z-axis is homing
        G28 Z
        G1 Z7 F9600
        STEPPER_DIAG_DISABLE  CHIP="stepper_z"
        SET_GCODE_VARIABLE MACRO=Z_HOMING VARIABLE=z_raise VALUE=1
    {% endif %}

    {% if params.X is defined and params.Y is defined and params.Z is undefined %} #XY
        G28  Y
        G28  X
    {% endif %}

    {% if params.X is undefined and params.Y is undefined and params.Z is undefined %} #XYZ
        G28  Y
        G28  X
        M400
        Z_HOMING
    {% endif %}
    G90

[gcode_macro Z_HOMING]
variable_z_raise: 1
gcode:
    {% set printer_state = printer.print_stats.state %}
        
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 MOVE=1

    SET_GCODE_VARIABLE MACRO=_CHANGE_TOOL VARIABLE=save_position VALUE=0
    T0

    {% if printer_state == "printing" or printer_state == "paused" %}
        M118 Nozzle is cleaning
        WIPE_NOZZLE
    {% endif %}
    G1 X150 Y135 F3000
    _LEVELING_TRIGGER_S
    M400
    STEPPER_DIAG_ENABLE CHIP="stepper_z"
    M118 Z-axis is homing
    G28 Z
    {% if z_raise == 1 %}
        G1 Z7 F9600
    {% endif %}
    STEPPER_DIAG_DISABLE CHIP="stepper_z"
    SET_GCODE_VARIABLE MACRO=Z_HOMING VARIABLE=z_raise VALUE=1



[screws_tilt_adjust]
screw1: 6,6
screw1_name: front_right
screw2: 250,6
screw2_name: front_left
screw3: 250,250
screw3_name: behind_left
screw4: 6,250
screw4_name: behind_right
horizontal_move_z: 10
screw_thread: CW-M3



[bed_mesh]
speed: 300                    # Calibration speed
horizontal_move_z:3        # Z-axis movement speed
mesh_min: 10, 10          # Minimum calibration point coordinates x, y
mesh_max: 290, 260         # Maximum calibration point coordinates x, y
probe_count: 7, 7             # Number of sampling points (7X7 is 49 points)
mesh_pps: 3, 3                # Number of supplementary sampling points
algorithm: bicubic           # algorithmic model
bicubic_tension: 0.6         # Algorithmic interpolation don't move



[input_shaper]
        
[respond]
default_type: echo
default_prefix: echo:

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
max_z_velocity: 30
max_z_accel: 500
square_corner_velocity: 5.0


[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
recover_velocity: 50.0 

[idle_timeout]
timeout: 600
gcode:
    M118 Idle timeout, all heaters off
    {% set thr_number = printer.save_variables.variables.thr_number|int %}
    {% for i in range(thr_number) %}
        M104 T{i} S0
    {% endfor %}


[force_move]
enable_force_move : true
    
[display_status]
  
[gcode_arcs]
resolution: 1.0

[exclude_object]

