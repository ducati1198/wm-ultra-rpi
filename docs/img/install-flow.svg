<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" font-family="Helvetica,Arial,sans-serif"><title>Installer steps</title><rect width="840" height="330" rx="14" fill="#0f172a"/><text x="30" y="38" fill="#f1f5f9" font-size="20" font-weight="700">What the installer does</text><rect x="30" y="70" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="120.0" y="104.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">1  Check</text><text x="120.0" y="126.0" text-anchor="middle" fill="#94a3b8" font-size="12">user t13dp, 64-bit</text><line x1="210" y1="110" x2="230" y2="110" stroke="#94a3b8" stroke-width="3" /><rect x="230" y="70" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="320.0" y="104.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">2  Get software</text><text x="320.0" y="126.0" text-anchor="middle" fill="#94a3b8" font-size="12">board / image / folder</text><line x1="410" y1="110" x2="430" y2="110" stroke="#94a3b8" stroke-width="3" /><rect x="430" y="70" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="520.0" y="104.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">3  Packages + Python 3.9</text><text x="520.0" y="126.0" text-anchor="middle" fill="#94a3b8" font-size="12">apt, uv</text><line x1="610" y1="110" x2="630" y2="110" stroke="#94a3b8" stroke-width="3" /><rect x="630" y="70" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="720.0" y="104.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">4  Unpack</text><text x="720.0" y="126.0" text-anchor="middle" fill="#94a3b8" font-size="12">klipper, moonraker, config</text><rect x="30" y="180" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="120.0" y="214.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">5  Environments</text><text x="120.0" y="236.0" text-anchor="middle" fill="#94a3b8" font-size="12">klippy-env, moonraker-env</text><line x1="210" y1="220" x2="230" y2="220" stroke="#94a3b8" stroke-width="3" /><rect x="230" y="180" width="180" height="80" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="320.0" y="214.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">6  Services</text><text x="320.0" y="236.0" text-anchor="middle" fill="#94a3b8" font-size="12">Moonraker on, Klipper OFF</text><line x1="410" y1="220" x2="430" y2="220" stroke="#94a3b8" stroke-width="3" /><rect x="430" y="180" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="520.0" y="214.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">7  nginx + can0</text><text x="520.0" y="236.0" text-anchor="middle" fill="#94a3b8" font-size="12">Fluidd, udev rule</text><line x1="610" y1="220" x2="630" y2="220" stroke="#94a3b8" stroke-width="3" /><rect x="630" y="180" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="720.0" y="214.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">8  Fluidd panel</text><text x="720.0" y="236.0" text-anchor="middle" fill="#94a3b8" font-size="12">optional</text><text x="30" y="300" fill="#fbbf24" font-size="14">Later, with the main board connected: ./installer.sh --enable-klipper</text></svg>