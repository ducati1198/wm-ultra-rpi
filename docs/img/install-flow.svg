<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="Helvetica,Arial,sans-serif"><title>Installer steps</title><rect width="840" height="470" rx="14" fill="#0f172a"/><text x="30" y="38" fill="#f1f5f9" font-size="20" font-weight="700">What the installer does</text><rect x="30" y="64" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="120" y="98" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">1  Pre-flight</text><text x="120" y="120" text-anchor="middle" fill="#94a3b8" font-size="11.5">internet, power, clock</text><line x1="210" y1="104" x2="230" y2="104" stroke="#94a3b8" stroke-width="3"/><rect x="230" y="64" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="320" y="98" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">2  Questions</text><text x="320" y="120" text-anchor="middle" fill="#94a3b8" font-size="11.5">model, panel, webcam</text><line x1="410" y1="104" x2="430" y2="104" stroke="#94a3b8" stroke-width="3"/><rect x="430" y="64" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="520" y="98" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">3  Plan</text><text x="520" y="120" text-anchor="middle" fill="#94a3b8" font-size="11.5">shown first, you confirm</text><line x1="610" y1="104" x2="630" y2="104" stroke="#94a3b8" stroke-width="3"/><rect x="630" y="64" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="720" y="98" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">4  Get software</text><text x="720" y="120" text-anchor="middle" fill="#94a3b8" font-size="11.5">board, image, folder, GitHub</text><rect x="30" y="174" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="120" y="208" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">5  Packages</text><text x="120" y="230" text-anchor="middle" fill="#94a3b8" font-size="11.5">apt, Python 3.9 (uv)</text><line x1="210" y1="214" x2="230" y2="214" stroke="#94a3b8" stroke-width="3"/><rect x="230" y="174" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="320" y="208" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">6  Unpack</text><text x="320" y="230" text-anchor="middle" fill="#94a3b8" font-size="11.5">old folders moved to backup</text><line x1="410" y1="214" x2="430" y2="214" stroke="#94a3b8" stroke-width="3"/><rect x="430" y="174" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="520" y="208" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">7  Environments</text><text x="520" y="230" text-anchor="middle" fill="#94a3b8" font-size="11.5">klippy-env, moonraker-env</text><line x1="610" y1="214" x2="630" y2="214" stroke="#94a3b8" stroke-width="3"/><rect x="630" y="174" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="720" y="208" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">8  Services</text><text x="720" y="230" text-anchor="middle" fill="#94a3b8" font-size="11.5">Moonraker, nginx, can0 rule</text><rect x="30" y="284" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="120" y="318" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">9  Add-ons</text><text x="120" y="340" text-anchor="middle" fill="#94a3b8" font-size="11.5">Fluidd panel, webcam, timelapse</text><line x1="210" y1="324" x2="230" y2="324" stroke="#94a3b8" stroke-width="3"/><rect x="230" y="284" width="180" height="80" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="320" y="318" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">10  Self-test</text><text x="320" y="340" text-anchor="middle" fill="#94a3b8" font-size="11.5">Moonraker and Fluidd answer</text><line x1="410" y1="324" x2="430" y2="324" stroke="#94a3b8" stroke-width="3"/><rect x="430" y="284" width="180" height="80" rx="10" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/><text x="520" y="318" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">11  Checks</text><text x="520" y="340" text-anchor="middle" fill="#94a3b8" font-size="11.5">USB, can0, CAN, canbus_uuid</text><line x1="610" y1="324" x2="630" y2="324" stroke="#94a3b8" stroke-width="3"/><rect x="630" y="284" width="180" height="80" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="720" y="318" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">12  Start all</text><text x="720" y="340" text-anchor="middle" fill="#94a3b8" font-size="11.5">Klipper and the 3 others</text><text x="30" y="410" fill="#fbbf24" font-size="14">No main board yet? It still enables everything and reports what is missing. Plug it in later: ./installer.sh --first-start</text><text x="30" y="436" fill="#94a3b8" font-size="13">Afterwards: --doctor  --repair  --update  --undo  --backup  --support-bundle</text></svg>