<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390" font-family="Helvetica,Arial,sans-serif"><title>Before and after: the Pi replaces the screen board</title><rect width="840" height="390" rx="14" fill="#0f172a"/><text x="30" y="38" fill="#f1f5f9" font-size="20" font-weight="700">Before and after</text><text x="200" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">BEFORE (failed)</text><text x="640" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">AFTER</text><rect x="40" y="90" width="320" height="70" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/><text x="200.0" y="119.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Screen / host board</text><text x="200.0" y="141.0" text-anchor="middle" fill="#94a3b8" font-size="12">WM-ZR-M V1.2 (RK3308B): dead</text><rect x="40" y="200" width="320" height="60" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="200.0" y="224.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Main board</text><text x="200.0" y="246.0" text-anchor="middle" fill="#94a3b8" font-size="12">WM-ZR-D V1.2 (replaced)</text><rect x="40" y="300" width="320" height="60" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="200.0" y="324.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Toolheads + filament hub</text><text x="200.0" y="346.0" text-anchor="middle" fill="#94a3b8" font-size="12">CAN bus, unchanged</text><line x1="200" y1="160" x2="200" y2="200" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 5"/><line x1="200" y1="260" x2="200" y2="300" stroke="#60a5fa" stroke-width="3" /><rect x="480" y="90" width="320" height="70" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="640.0" y="119.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Raspberry Pi 4 or 5</text><text x="640.0" y="141.0" text-anchor="middle" fill="#94a3b8" font-size="12">WonderMaker Klipper + Moonraker + Fluidd</text><rect x="480" y="200" width="320" height="60" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="640.0" y="224.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Main board</text><text x="640.0" y="246.0" text-anchor="middle" fill="#94a3b8" font-size="12">new one, USB-CAN bridge</text><rect x="480" y="300" width="320" height="60" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="640.0" y="324.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Toolheads + filament hub</text><text x="640.0" y="346.0" text-anchor="middle" fill="#94a3b8" font-size="12">CAN bus, unchanged</text><line x1="640" y1="160" x2="640" y2="200" stroke="#22c55e" stroke-width="3" /><text x="662" y="185" text-anchor="middle" fill="#cbd5e1" font-size="12">USB</text><line x1="640" y1="260" x2="640" y2="300" stroke="#60a5fa" stroke-width="3" /><text x="690" y="285" text-anchor="middle" fill="#cbd5e1" font-size="12">CAN 1 Mbit</text><text x="420" y="240" text-anchor="middle" fill="#f1f5f9" font-size="30">→</text></svg>