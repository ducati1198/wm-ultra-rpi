<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" font-family="Helvetica,Arial,sans-serif"><title>Wiring of the Pi, main board and toolheads</title><rect width="840" height="380" rx="14" fill="#0f172a"/><text x="30" y="38" fill="#f1f5f9" font-size="20" font-weight="700">Wiring</text><rect x="30" y="70" width="200" height="80" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/><text x="130.0" y="104.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Raspberry Pi 400</text><text x="130.0" y="126.0" text-anchor="middle" fill="#94a3b8" font-size="12">own 5 V power supply</text><rect x="320" y="70" width="220" height="80" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="430.0" y="104.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Main board</text><text x="430.0" y="126.0" text-anchor="middle" fill="#94a3b8" font-size="12">Klipper USB-CAN bridge</text><rect x="630" y="70" width="170" height="80" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="715.0" y="104.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Toolhead hub</text><text x="715.0" y="126.0" text-anchor="middle" fill="#94a3b8" font-size="12">CAN H / CAN L</text><line x1="230" y1="110" x2="320" y2="110" stroke="#22c55e" stroke-width="3" /><text x="275" y="100" text-anchor="middle" fill="#cbd5e1" font-size="12">USB cable</text><line x1="540" y1="110" x2="630" y2="110" stroke="#60a5fa" stroke-width="3" /><text x="585" y="100" text-anchor="middle" fill="#cbd5e1" font-size="12">CAN</text><rect x="320" y="220" width="220" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="430.0" y="244.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Printer power supply</text><text x="430.0" y="266.0" text-anchor="middle" fill="#94a3b8" font-size="12">powers the main board</text><line x1="430" y1="220" x2="430" y2="150" stroke="#64748b" stroke-width="3" stroke-dasharray="5 4"/><text x="452" y="190" text-anchor="middle" fill="#cbd5e1" font-size="12">printer power</text><rect x="30" y="220" width="200" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="130.0" y="244.0" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Network / Wi-Fi</text><text x="130.0" y="266.0" text-anchor="middle" fill="#94a3b8" font-size="12">Fluidd in your browser</text><line x1="130" y1="220" x2="130" y2="150" stroke="#64748b" stroke-width="3" stroke-dasharray="5 4"/><text x="30" y="330" fill="#94a3b8" font-size="13">The Pi has its own 5 V power supply. The USB cable to the main board is for data (Klipper bridge 1d50:606f).</text><text x="30" y="352" fill="#94a3b8" font-size="13">Connector positions depend on your board revision: check the WonderMaker manual before plugging anything in.</text></svg>