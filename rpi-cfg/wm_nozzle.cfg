# wm_nozzle.cfg  -  Nozzle Type and Extruder Setup for the Raspberry Pi (not part of WonderMaker's files)
#
# These two macros do from Fluidd what two pages of the WonderMaker screen app (General) do:
#   screen: General > Nozzle Type             WM_NOZZLE_TYPE      pick a nozzle, its material (hardened / stainless steel) and diameter
#   screen: General > Extruder Setup          WM_EXTRUDER_SETUP   release the tool heads so you can change nozzles, with the same instructions
#                                             WM_EXTRUDER_SETUP_END   finish (also use it if you cancel or the wizard stops half way)
# Each one opens a window in Fluidd and walks you through it, like WM_QUICK_START.
#
# How they work, so nothing is a surprise:
#   WM_NOZZLE_TYPE   saves the material as nozzle_type0..3 in saved_variables.cfg, and writes the diameter into
#                    "nozzle_diameter:" of [extruder] / [extruder1] ... in printer.cfg (a copy of printer.cfg is kept first).
#                    That edit is done by wm_nozzle.py through Klipper's gcode shell command extension, so this file needs it
#                    (the installer adds both). Klipper has to be restarted to read the new diameter; the window offers it.
#                    Klipper itself only uses the diameter as a label; your slicer's nozzle setting is what counts.
#   WM_EXTRUDER_SETUP sets is_nozzle_setting = 1 in saved_variables.cfg (WonderMaker's own switch: the tool change macros then
#                    stop complaining that a tool is missing from its dock), parks the tool that is on the carriage in its dock
#                    and unlocks it. WM_EXTRUDER_SETUP_END puts the switch back to 0. The calibration macros refuse to start while
#                    the switch is 1, because with it on the printer cannot tell that a tool is missing.
#
# Safety: both refuse to start while a print is running or paused. Extruder Setup also needs every heater off and the hotends below 50 C.

[gcode_shell_command wm_nozzle]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_nozzle.py" "$@"' wm_nozzle
timeout: 10.0
verbose: True

# ------------------------------------------------------------------ Nozzle Type

[gcode_macro WM_NOZZLE_TYPE]
description: Set the nozzle material and diameter of a tool head, in a Fluidd window (app: General > Nozzle Type)
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nozzle Type not started.")}
    {% endif %}
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% set info = [] %}
    {% for t in range(count) %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% set dia = printer.configfile.settings[hn].nozzle_diameter|default(0)|float if hn in printer.configfile.settings else 0 %}
        {% set ty = vars['nozzle_type%d' % t]|default(0)|int %}
        {% set _ = info.append("Nozzle %d: %s, %s mm" % (t + 1, "stainless steel" if ty == 1 else "hardened steel", dia)) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle Type"
    RESPOND TYPE=command MSG="action:prompt_text Tell the printer which nozzle is on which tool head. Now: {info|join(' | ')}."
    RESPOND TYPE=command MSG="action:prompt_text Pick the nozzle you changed. Next you choose its material and its diameter. Nothing is written until you confirm at the end."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for t in range(count) %}
        RESPOND TYPE=command MSG="action:prompt_button Nozzle {t + 1}|_WM_NOZZLE_MATERIAL T={t}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_MATERIAL]
description: Nozzle Type, step 2: material of nozzle T (0-3)
gcode:
    {% set t = params.T|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1}: material"
    RESPOND TYPE=command MSG="action:prompt_text Hardened steel is for abrasive filaments (carbon fiber, glow in the dark). Stainless steel is the normal nozzle."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Hardened steel|_WM_NOZZLE_DIAMETER T={t} TYPE=0|primary"
    RESPOND TYPE=command MSG="action:prompt_button Stainless steel|_WM_NOZZLE_DIAMETER T={t} TYPE=1|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|WM_NOZZLE_TYPE"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_DIAMETER]
description: Nozzle Type, step 3: diameter of nozzle T (0-3), material TYPE (0 hardened, 1 stainless)
gcode:
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1}: diameter"
    RESPOND TYPE=command MSG="action:prompt_text Diameter of the nozzle you put on tool head {t + 1}."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 0.2 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.2|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.4 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.4|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.6 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.6|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.8 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.8|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_NOZZLE_MATERIAL T={t}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_SURE]
description: Nozzle Type, step 4: show what will be written
gcode:
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    {% set d = params.D|default(0.4)|float %}
    RESPOND TYPE=command MSG="action:prompt_begin Confirm Nozzle {t + 1}"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {t + 1}: {'stainless steel' if ty == 1 else 'hardened steel'}, {d} mm."
    RESPOND TYPE=command MSG="action:prompt_text This saves the material in saved_variables.cfg and sets nozzle_diameter in printer.cfg (a copy of printer.cfg is kept). Klipper must be restarted afterwards to read the diameter."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Apply|_WM_NOZZLE_APPLY T={t} TYPE={ty} D={d}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_APPLY]
description: Nozzle Type, last step: write the material and the diameter
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nothing was changed.")}
    {% endif %}
    {% if 'gcode_shell_command wm_nozzle' not in printer.configfile.settings %}
        {action_raise_error("The wm_nozzle shell command is not loaded. Run ./installer.sh --rpi-cfg and restart Klipper.")}
    {% endif %}
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    {% set d = params.D|default(0.4)|float %}
    SAVE_VARIABLE VARIABLE=nozzle_type{t} VALUE={ty}
    RUN_SHELL_COMMAND CMD=wm_nozzle PARAMS="set {t} {d} {ty}"
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1} saved"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {t + 1} is now {'stainless steel' if ty == 1 else 'hardened steel'}, {d} mm. Klipper reads the new diameter when it restarts."
    RESPOND TYPE=command MSG="action:prompt_text If you changed the nozzle itself, run WM_NOZZLE_TEMP_CAL (hotend PID) and the extruder offsets afterwards, because the new nozzle sits a little differently."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Restart Klipper now|RESTART|primary"
    RESPOND TYPE=command MSG="action:prompt_button Set another nozzle|WM_NOZZLE_TYPE|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Later|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ Extruder Setup

[gcode_macro WM_EXTRUDER_SETUP]
description: Release the tool heads so you can change nozzles, in a Fluidd window (app: General > Extruder Setup)
gcode:
    _WM_EXSETUP_CHECK
    RESPOND TYPE=command MSG="action:prompt_begin Extruder Setup"
    RESPOND TYPE=command MSG="action:prompt_text Operating instructions: please hang the extruders on the rear support, and avoid tangling of the wires."
    RESPOND TYPE=command MSG="action:prompt_text What happens when you click Next: the printer turns the tool change check off (is_nozzle_setting = 1), moves the tool that is on the carriage to its dock and unlocks it. Nothing heats. Then you take the tool heads out and work on the nozzles."
    RESPOND TYPE=command MSG="action:prompt_text Before you start: heaters off and hotends cold (below 50 C), bed clear, hand ready to hold the tool when it is released. When you finish, put the tools back in their docks and click Done. If you forget, run WM_EXTRUDER_SETUP_END."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Next|_WM_EXSETUP_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_EXSETUP_CHECK]
description: Stop unless it is safe to release the tool heads
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Extruder Setup not started.")}
    {% endif %}
    {% for h in printer.heaters.available_heaters %}
        {% if printer[h].target|float > 0 %}
            {action_raise_error("%s has a target of %s C. Turn it off first (WM_CAL_STOP), then start again." % (h, printer[h].target))}
        {% endif %}
        {% if h.startswith('extruder') and printer[h].temperature|float > 50 %}
            {action_raise_error("%s is still at %s C. Wait until it is below 50 C." % (h, printer[h].temperature|float|round(0)|int))}
        {% endif %}
    {% endfor %}

[gcode_macro _WM_EXSETUP_RUN]
description: Extruder Setup, step 2: tool change check off, park and unlock the tool on the carriage
gcode:
    _WM_EXSETUP_CHECK
    {% set vars = printer.save_variables.variables %}
    {% set current = vars.current_extruder|default(99)|int %}
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=1
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_EXSETUP_FAILED REASON="WonderMaker's tool change error flag (fail_flag) is {vars.fail_flag}. The printer needs that cleared before it moves a tool."
    {% else %}
        {% if current != 99 %}
            RESPOND MSG="Parking tool T{current} in its dock and unlocking it..."
            _UNLOCK_TOOL T={current}
            M400
        {% endif %}
        _WM_EXSETUP_AFTER
    {% endif %}

[gcode_macro _WM_EXSETUP_AFTER]
description: Extruder Setup, step 3: tell the result of the unlock
gcode:
    {% set vars = printer.save_variables.variables %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_EXSETUP_FAILED REASON="The unlock did not succeed (fail_flag {vars.fail_flag}, tool T{vars.fail_tool}). Check that the tool is seated in its dock."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Extruder Setup: tools released"
        RESPOND TYPE=command MSG="action:prompt_text The carriage is free. Hang the tool heads on the rear support, mind the wires, and change the nozzles."
        RESPOND TYPE=command MSG="action:prompt_text When you are done, put every tool back in its dock and click Done. The printer then turns the tool change check on again and tells you if a dock looks empty. Afterwards run WM_NOZZLE_TYPE to record the new nozzles."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Done|WM_EXTRUDER_SETUP_END|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_EXSETUP_FAILED]
description: Extruder Setup stopped: put the switch back and say why
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    RESPOND TYPE=command MSG="action:prompt_begin Extruder Setup stopped"
    RESPOND TYPE=command MSG="action:prompt_text {params.REASON}"
    RESPOND TYPE=command MSG="action:prompt_text The tool change check is on again (is_nozzle_setting = 0). Nothing else was changed."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro WM_EXTRUDER_SETUP_END]
description: Finish Extruder Setup: tool change check back on (is_nozzle_setting = 0), and a look at the docks
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set empty = [] %}
    {% for t in range(count) %}
        {% if 'filament_switch_sensor docked%d' % t in printer.configfile.settings %}
            {% if not printer['filament_switch_sensor docked%d' % t].filament_detected %}
                {% set _ = empty.append(t + 1) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Extruder Setup finished"
    {% if empty|length > 0 %}
        RESPOND TYPE=command MSG="action:prompt_text The dock sensor of tool head {empty|join(', ')} shows an empty dock. Put it back in its dock before you print or change tools."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Every tool head is seen in its dock. The tool change check is on again."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text If you changed a nozzle, record it with WM_NOZZLE_TYPE, then tune the hotend (WM_NOZZLE_TEMP_CAL) and the extruder offsets (WM_TOOL_OFFSETS)."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Nozzle Type|WM_NOZZLE_TYPE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"
