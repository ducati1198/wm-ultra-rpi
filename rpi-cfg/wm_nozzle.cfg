# wm_nozzle.cfg  -  Nozzle Type and Extruder Setup for the Raspberry Pi (not part of WonderMaker's files)
#
# These macros do from Fluidd what two pages of the WonderMaker screen app (General) do, plus one that only the Pi has:
#   screen: General > Nozzle Type             WM_NOZZLE_TYPE      pick a nozzle, its material (hardened / stainless steel) and diameter
#   screen: General > Extruder Setup          WM_EXTRUDER_SETUP   the app's page: the instructions and Set Up, which matches the tool heads to their docks and fixes the CAN ids
#   (no page in the app)                      WM_NOZZLE_CHANGE    release the tool heads so you can change nozzles (Pi only)
#                                             WM_NOZZLE_CHANGE_END   finish it (also use it if you cancel or the wizard stops half way)
# Each one opens a window in Fluidd and walks you through it, like WM_FULL_CALIBRATION.
#
# How they work, so nothing is a surprise:
#   WM_NOZZLE_TYPE   saves the material as nozzle_type0..3 in saved_variables.cfg, and writes the diameter into
#                    "nozzle_diameter:" of [extruder] / [extruder1] ... in printer.cfg (a copy of printer.cfg is kept first).
#                    That edit is done by wm_nozzle.py through Klipper's gcode shell command extension, so this file needs it
#                    (the installer adds both). Klipper has to be restarted to read the new diameter; the window offers it.
#                    Klipper itself only uses the diameter as a label; your slicer's nozzle setting is what counts.
#   WM_NOZZLE_CHANGE sets is_nozzle_setting = 1 in saved_variables.cfg (WonderMaker's own switch: the tool change macros then
#                    stop complaining that a tool is missing from its dock), parks the tool that is on the carriage in its dock
#                    and unlocks it. WM_NOZZLE_CHANGE_END puts the switch back to 0. The calibration macros refuse to start while
#                    the switch is 1, because with it on the printer cannot tell that a tool is missing.
#
#   WM_EXTRUDER_SETUP  does what the app's Set Up button does (read from the app, not guessed): it picks up T0, T1, T2 and T3 one after the other with
#                    is_nozzle_setting = 1, and after each pick looks at the dock sensors for the first dock that is empty. If tool n came out of
#                    dock m, then tool n gets the CAN id that was stored for dock m. Nothing is written while it runs. At the end it parks the
#                    tool and shows the result. If every tool came out of its own dock nothing changes. If the ids would change it asks, and on
#                    Apply wm_canids.py writes them into wm_zru_thr0.cfg ... wm_zru_thr3.cfg (a copy of each changed file is kept) and Klipper
#                    does FIRMWARE_RESTART. If two tools would end up with the same id it writes nothing. Unlike the app, it also stops at the
#                    first tool that cannot be picked up, instead of going on.
#
# Safety: all of them refuse to start while a print is running or paused. Both Extruder Setup and the nozzle change need every heater off and the hotends below 50 C.

[gcode_shell_command wm_nozzle]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_nozzle.py" "$@"' wm_nozzle
timeout: 10.0
verbose: True

[gcode_shell_command wm_canids]
command: bash -c 'exec python3 "$HOME/printer_data/wm-tools/wm_canids.py" "$@"' wm_canids
timeout: 10.0
verbose: True

# ------------------------------------------------------------------ Nozzle Type

[gcode_macro WM_NOZZLE_TYPE]
description: Set the nozzle material and diameter of a tool head, in a Fluidd window (app: General > Nozzle Type)
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nozzle Type not started.")}
    {% endif %}
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% set info = [] %}
    {% for t in range(count) %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% set dia = printer.configfile.settings[hn].nozzle_diameter|default(0)|float if hn in printer.configfile.settings else 0 %}
        {% set ty = vars['nozzle_type%d' % t]|default(0)|int %}
        {% set _ = info.append("Nozzle %d: %s, %s mm" % (t + 1, "stainless steel" if ty == 1 else "hardened steel", dia)) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle Type"
    RESPOND TYPE=command MSG="action:prompt_text Tell the printer which nozzle is on which tool head. Now: {info|join(' | ')}."
    RESPOND TYPE=command MSG="action:prompt_text Pick the nozzle you changed. Next you choose its material and its diameter. Nothing is written until you confirm at the end."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for t in range(count) %}
        RESPOND TYPE=command MSG="action:prompt_button Nozzle {t + 1}|_WM_NOZZLE_MATERIAL T={t}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_MATERIAL]
description: Nozzle Type, step 2: material of nozzle T (0-3)
gcode:
    {% set t = params.T|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1}: material"
    RESPOND TYPE=command MSG="action:prompt_text Hardened steel is for abrasive filaments (carbon fiber, glow in the dark). Stainless steel is the normal nozzle."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Hardened steel|_WM_NOZZLE_DIAMETER T={t} TYPE=0|primary"
    RESPOND TYPE=command MSG="action:prompt_button Stainless steel|_WM_NOZZLE_DIAMETER T={t} TYPE=1|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|WM_NOZZLE_TYPE"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_DIAMETER]
description: Nozzle Type, step 3: diameter of nozzle T (0-3), material TYPE (0 hardened, 1 stainless)
gcode:
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1}: diameter"
    RESPOND TYPE=command MSG="action:prompt_text Diameter of the nozzle you put on tool head {t + 1}."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 0.2 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.2|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.4 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.4|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.6 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.6|primary"
    RESPOND TYPE=command MSG="action:prompt_button 0.8 mm|_WM_NOZZLE_SURE T={t} TYPE={ty} D=0.8|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_WM_NOZZLE_MATERIAL T={t}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_SURE]
description: Nozzle Type, step 4: show what will be written
gcode:
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    {% set d = params.D|default(0.4)|float %}
    RESPOND TYPE=command MSG="action:prompt_begin Confirm Nozzle {t + 1}"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {t + 1}: {'stainless steel' if ty == 1 else 'hardened steel'}, {d} mm."
    RESPOND TYPE=command MSG="action:prompt_text This saves the material in saved_variables.cfg and sets nozzle_diameter in printer.cfg (a copy of printer.cfg is kept). Klipper must be restarted afterwards to read the diameter."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Apply|_WM_NOZZLE_APPLY T={t} TYPE={ty} D={d}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NOZZLE_APPLY]
description: Nozzle Type, last step: write the material and the diameter
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nothing was changed.")}
    {% endif %}
    {% if 'gcode_shell_command wm_nozzle' not in printer.configfile.settings %}
        {action_raise_error("The wm_nozzle shell command is not loaded. Run ./installer.sh --rpi-cfg and restart Klipper.")}
    {% endif %}
    {% set t = params.T|default(0)|int %}
    {% set ty = params.TYPE|default(0)|int %}
    {% set d = params.D|default(0.4)|float %}
    SAVE_VARIABLE VARIABLE=nozzle_type{t} VALUE={ty}
    RUN_SHELL_COMMAND CMD=wm_nozzle PARAMS="set {t} {d} {ty}"
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle {t + 1} saved"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {t + 1} is now {'stainless steel' if ty == 1 else 'hardened steel'}, {d} mm. Klipper reads the new diameter when it restarts."
    RESPOND TYPE=command MSG="action:prompt_text If you changed the nozzle itself, run WM_NOZZLE_TEMP_CAL (hotend PID) and the extruder offsets afterwards, because the new nozzle sits a little differently."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Restart Klipper now|RESTART|primary"
    RESPOND TYPE=command MSG="action:prompt_button Set another nozzle|WM_NOZZLE_TYPE|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Later|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ Change nozzles (Pi only)

[gcode_macro WM_NOZZLE_CHANGE]
description: Release the tool heads so you can change nozzles, in a Fluidd window (Pi only: the app has no such page)
gcode:
    _WM_NCHANGE_CHECK
    RESPOND TYPE=command MSG="action:prompt_begin Change nozzles"
    RESPOND TYPE=command MSG="action:prompt_text Operating instructions: please hang the extruders on the rear support, and avoid tangling of the wires."
    RESPOND TYPE=command MSG="action:prompt_text What happens when you click Next: the printer turns the tool change check off (is_nozzle_setting = 1), moves the tool that is on the carriage to its dock and unlocks it. Nothing heats. Then you take the tool heads out and work on the nozzles."
    RESPOND TYPE=command MSG="action:prompt_text Before you start: heaters off and hotends cold (below 50 C), bed clear, hand ready to hold the tool when it is released. When you finish, put the tools back in their docks and click Done. If you forget, run WM_NOZZLE_CHANGE_END."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Next|_WM_NCHANGE_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_NCHANGE_CHECK]
description: Stop unless it is safe to release the tool heads
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nozzle change not started.")}
    {% endif %}
    {% for h in printer.heaters.available_heaters %}
        {% if printer[h].target|float > 0 %}
            {action_raise_error("%s has a target of %s C. Turn it off first (WM_CAL_STOP), then start again." % (h, printer[h].target))}
        {% endif %}
        {% if h.startswith('extruder') and printer[h].temperature|float > 50 %}
            {action_raise_error("%s is still at %s C. Wait until it is below 50 C." % (h, printer[h].temperature|float|round(0)|int))}
        {% endif %}
    {% endfor %}

[gcode_macro _WM_NCHANGE_RUN]
description: Change nozzles, step 2: tool change check off, park and unlock the tool on the carriage
gcode:
    _WM_NCHANGE_CHECK
    {% set vars = printer.save_variables.variables %}
    {% set current = vars.current_extruder|default(99)|int %}
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=1
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_NCHANGE_FAILED REASON="WonderMaker's tool change error flag (fail_flag) is {vars.fail_flag}. The printer needs that cleared before it moves a tool."
    {% else %}
        {% if current != 99 %}
            RESPOND MSG="Parking tool T{current} in its dock and unlocking it..."
            _UNLOCK_TOOL T={current}
            M400
        {% endif %}
        _WM_NCHANGE_AFTER
    {% endif %}

[gcode_macro _WM_NCHANGE_AFTER]
description: Change nozzles, step 3: tell the result of the unlock
gcode:
    {% set vars = printer.save_variables.variables %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_NCHANGE_FAILED REASON="The unlock did not succeed (fail_flag {vars.fail_flag}, tool T{vars.fail_tool}). Check that the tool is seated in its dock."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Change nozzles: tools released"
        RESPOND TYPE=command MSG="action:prompt_text The carriage is free. Hang the tool heads on the rear support, mind the wires, and change the nozzles."
        RESPOND TYPE=command MSG="action:prompt_text When you are done, put every tool back in its dock and click Done. The printer then turns the tool change check on again and tells you if a dock looks empty. Afterwards run WM_NOZZLE_TYPE to record the new nozzles."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Done|WM_NOZZLE_CHANGE_END|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _WM_NCHANGE_FAILED]
description: Nozzle change stopped: put the switch back and say why
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle change stopped"
    RESPOND TYPE=command MSG="action:prompt_text {params.REASON}"
    RESPOND TYPE=command MSG="action:prompt_text The tool change check is on again (is_nozzle_setting = 0). Nothing else was changed."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro WM_NOZZLE_CHANGE_END]
description: Finish the nozzle change: tool change check back on (is_nozzle_setting = 0), and a look at the docks
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set empty = [] %}
    {% for t in range(count) %}
        {% if 'filament_switch_sensor docked%d' % t in printer.configfile.settings %}
            {% if not printer['filament_switch_sensor docked%d' % t].filament_detected %}
                {% set _ = empty.append(t + 1) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Nozzle change finished"
    {% if empty|length > 0 %}
        RESPOND TYPE=command MSG="action:prompt_text The dock sensor of tool head {empty|join(', ')} shows an empty dock. Put it back in its dock before you print or change tools."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Every tool head is seen in its dock. The tool change check is on again."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text If you changed a nozzle, record it with WM_NOZZLE_TYPE, then tune the hotend (WM_NOZZLE_TEMP_CAL) and the extruder offsets (WM_OFFSETS_RAPID or WM_OFFSETS_ACCURATE)."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_text If you moved tool heads to other docks, run WM_EXTRUDER_SETUP (its Set Up button does the matching) so each tool gets the right CAN id."
    RESPOND TYPE=command MSG="action:prompt_button Nozzle Type|WM_NOZZLE_TYPE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Extruder Setup|WM_EXTRUDER_SETUP|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ Extruder Setup (the screen's page: instructions + Set Up = matching)

[gcode_macro _WM_MATCH_STATE]
description: Memory of WM_EXTRUDER_SETUP (Set Up): the dock that was empty after each pick (do not run)
variable_actual: []
gcode:

[gcode_macro _WM_MATCH_CHECK]
description: Stop unless the matching can start
gcode:
    _WM_NCHANGE_CHECK
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% if 'gcode_shell_command wm_canids' not in printer.configfile.settings %}
        {action_raise_error("The wm_canids shell command is not loaded. Run ./installer.sh --rpi-cfg and restart Klipper.")}
    {% endif %}
    {% if vars.is_nozzle_setting|default(0)|int == 1 %}
        {action_raise_error("The nozzle change is still on. Put the tool heads back in their docks and click Done (or run WM_NOZZLE_CHANGE_END) first.")}
    {% endif %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        {action_raise_error("WonderMaker's tool change error flag (fail_flag) is %s. The printer needs that cleared before it moves a tool." % vars.fail_flag)}
    {% endif %}
    {% for t in range(count) %}
        {% if 'filament_switch_sensor docked%d' % t not in printer.configfile.settings %}
            {action_raise_error("There is no dock sensor docked%d. The matching cannot tell which dock is empty." % t)}
        {% elif not printer['filament_switch_sensor docked%d' % t].filament_detected %}
            {action_raise_error("Tool head %d is not seen in its dock. The matching needs all %d tool heads hanging in their docks." % (t + 1, count))}
        {% endif %}
        {% set sec = 'mcu t%d' % t %}
        {% if sec not in printer.configfile.settings or not printer.configfile.settings[sec].canbus_uuid|default('') %}
            {action_raise_error("[mcu T%d] has no canbus_uuid in the config. Fix the CAN ids first (./installer.sh --can-ids)." % t)}
        {% endif %}
    {% endfor %}

[gcode_macro WM_EXTRUDER_SETUP]
description: The screen's Extruder Setup page: instructions and Set Up, which matches the tool heads to their CAN ids (app: General > Extruder Setup)
gcode:
    _WM_MATCH_CHECK
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set ids = [] %}
    {% for t in range(count) %}
        {% set _ = ids.append("T%d %s" % (t, printer.configfile.settings['mcu t%d' % t].canbus_uuid)) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Extruder Setup"
    RESPOND TYPE=command MSG="action:prompt_text Operating instructions: please hang the extruders on the rear support, and avoid tangling of the wires."
    RESPOND TYPE=command MSG="action:prompt_text Once all extruders are in place, ensure there are no obstructions in their path. Ensure the above operations are completed before clicking Set Up for extruder sequencing."
    RESPOND TYPE=command MSG="action:prompt_text Set Up picks up T0, T1, T2 and T3 one after the other (about 2 minutes) and after each pick looks at the dock sensors to see which dock came out empty. Heaters off, hotends cold, bed clear. The printer homes first if it is not homed."
    RESPOND TYPE=command MSG="action:prompt_text CAN ids now: {ids|join(' | ')}. Nothing is written while it runs. If every tool came out of its own dock nothing changes; if the ids would change you are asked before they are written."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Set Up|_WM_MATCH_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_MATCH_RUN]
description: Matching, step 2: home, park the tool on the carriage, then pick the tools one by one
gcode:
    _WM_MATCH_CHECK
    {% set vars = printer.save_variables.variables %}
    SET_GCODE_VARIABLE MACRO=_WM_MATCH_STATE VARIABLE=actual VALUE="[]"
    RESPOND TYPE=command MSG="action:prompt_end"
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=1
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        RESPOND MSG="Homing..."
        G28
    {% endif %}
    {% if vars.current_extruder|default(99)|int != 99 %}
        RESPOND MSG="Parking the tool that is on the carriage..."
        PARK_CURRENT_TOOL
        M400
    {% endif %}
    _WM_MATCH_STEP N=0

[gcode_macro _WM_MATCH_STEP]
description: Matching: pick up tool N and see which dock came out empty
gcode:
    {% set n = params.N|default(0)|int %}
    {% set vars = printer.save_variables.variables %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_MATCH_STOP REASON="WonderMaker's tool change error flag (fail_flag) is {vars.fail_flag} before T{n}."
    {% else %}
        RESPOND MSG="Matching: picking up T{n} ({n + 1} of {vars.thr_number|default(4)|int})..."
        T{n}
        M400
        G4 P1000
        _WM_MATCH_AFTER N={n}
    {% endif %}

[gcode_macro _WM_MATCH_AFTER]
description: Matching: note the empty dock after the pick of tool N, then go on with the next tool or finish
gcode:
    {% set n = params.N|default(0)|int %}
    {% set vars = printer.save_variables.variables %}
    {% set count = vars.thr_number|default(4)|int %}
    {% set found = [] %}
    {% for t in range(count) %}
        {% if not found and not printer['filament_switch_sensor docked%d' % t].filament_detected %}
            {% set _ = found.append(t) %}
        {% endif %}
    {% endfor %}
    {% if vars.fail_flag|default(0)|int != 0 %}
        _WM_MATCH_STOP REASON="T{n} could not be picked up (fail_flag {vars.fail_flag}, tool T{vars.fail_tool|default(n)}). Check that its tool head hangs in the dock."
    {% elif not found %}
        _WM_MATCH_STOP REASON="After the pick of T{n} no dock sensor shows an empty dock. Check that the tool head hangs in the dock."
    {% else %}
        {% set seen = printer['gcode_macro _WM_MATCH_STATE'].actual + [found[0]] %}
        SET_GCODE_VARIABLE MACRO=_WM_MATCH_STATE VARIABLE=actual VALUE="{seen}"
        RESPOND MSG="Matching: asked for T{n}, the empty dock is tool head {found[0] + 1}."
        {% if n + 1 < count %}
            _WM_MATCH_STEP N={n + 1}
        {% else %}
            _WM_MATCH_FINISH
        {% endif %}
    {% endif %}

[gcode_macro _WM_MATCH_FINISH]
description: Matching: park the tool, switch off, show what the result means
gcode:
    PARK_CURRENT_TOOL
    M400
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set actual = printer['gcode_macro _WM_MATCH_STATE'].actual %}
    {% set old = [] %}
    {% for t in range(count) %}
        {% set _ = old.append(printer.configfile.settings['mcu t%d' % t].canbus_uuid|lower) %}
    {% endfor %}
    {% set new = [] %}
    {% for t in range(count) %}
        {% set _ = new.append(old[actual[t]]) %}
    {% endfor %}
    {% set dup = [] %}
    {% for a in range(count) %}
        {% for b in range(a + 1, count) %}
            {% if new[a] == new[b] %}
                {% set _ = dup.append("T%d and T%d" % (a, b)) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% set docks = [] %}
    {% for t in range(count) %}
        {% set _ = docks.append("T%d: dock %d" % (t, actual[t] + 1)) %}
    {% endfor %}
    {% set moves = [] %}
    {% for t in range(count) %}
        {% if new[t] != old[t] %}
            {% set _ = moves.append("T%d: %s -> %s (from dock %d)" % (t, old[t], new[t], actual[t] + 1)) %}
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Matching result"
    {% if dup %}
        RESPOND TYPE=command MSG="action:prompt_text {dup|join(', ')} would get the same CAN id, so nothing was written (the dock that was empty after each pick: {docks|join(', ')}). Check that every tool head hangs in its own dock and run the matching again."
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    {% elif not moves %}
        RESPOND TYPE=command MSG="action:prompt_text Every tool came out of its own dock (T0 to T{count - 1} in order). The CAN ids are right and nothing was changed."
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text The tools did not come out of the docks in the order asked. WonderMaker's screen gives each tool the CAN id that was stored for the dock it came out of:"
        RESPOND TYPE=command MSG="action:prompt_text {moves|join(' | ')}"
        RESPOND TYPE=command MSG="action:prompt_text Apply writes these into wm_zru_thr0.cfg ... wm_zru_thr{count - 1}.cfg (a copy of each changed file is kept) and restarts the firmware."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Apply and restart|_WM_MATCH_APPLY ID0={new[0]} ID1={new[1]} ID2={new[2]} ID3={new[3]}|primary"
        RESPOND TYPE=command MSG="action:prompt_button Leave as is|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_MATCH_APPLY]
description: Matching, last step: write the four CAN ids and restart the firmware
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("A print is running or paused. Nothing was changed.")}
    {% endif %}
    {% if 'gcode_shell_command wm_canids' not in printer.configfile.settings %}
        {action_raise_error("The wm_canids shell command is not loaded. Run ./installer.sh --rpi-cfg and restart Klipper.")}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RUN_SHELL_COMMAND CMD=wm_canids PARAMS="apply {params.ID0} {params.ID1} {params.ID2} {params.ID3}"
    RESPOND MSG="CAN ids written. Restarting the firmware..."
    FIRMWARE_RESTART

[gcode_macro _WM_MATCH_STOP]
description: Matching stopped: switch is_nozzle_setting off and say why, nothing is written
gcode:
    SAVE_VARIABLE VARIABLE=is_nozzle_setting VALUE=0
    RESPOND TYPE=command MSG="action:prompt_begin Matching stopped"
    RESPOND TYPE=command MSG="action:prompt_text {params.REASON}"
    RESPOND TYPE=command MSG="action:prompt_text Nothing was written to the CAN id files. The tool change check is on again (is_nozzle_setting = 0). A tool may still be on the carriage: check the printer before you move anything."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"
