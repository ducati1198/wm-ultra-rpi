# The Raspberry Pi's own temperature, shown in Fluidd next to the heaters.
# It reads the Pi's CPU temperature and does not use the host MCU or any printer board.
# max_temp is the Pi's own limit: a Raspberry Pi slows itself down at about 80 C and is in trouble above 85 C.
# If the Pi ever reads above max_temp Klipper stops the printer, so a failing fan or a blocked case is noticed.
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 85
