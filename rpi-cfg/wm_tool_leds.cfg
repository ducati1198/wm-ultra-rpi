# Tool head LEDs: blue while filament is in the tool head (its filament sensor), red when there is none.
# The factory screen set these colours itself. On the Pi nothing called the LED macros, so the LEDs stayed dark.
# Checked every 2 seconds. Uses the [neopixel T0_RGB] .. [neopixel T3_RGB] and [filament_switch_sensor filament0] .. filament3
# of WonderMaker's extruder0.cfg .. extruder3.cfg.
[delayed_gcode WM_TOOL_LEDS]
initial_duration: 5
gcode:
    {% for t in range(4) %}
        {% set s = printer["filament_switch_sensor filament%d" % t] %}
        {% if s is defined and s.filament_detected %}
            SET_LED LED=T{t}_RGB RED=0.0 GREEN=0.0 BLUE=1.0 TRANSMIT=1
        {% else %}
            SET_LED LED=T{t}_RGB RED=1.0 GREEN=0.0 BLUE=0.0 TRANSMIT=1
        {% endif %}
    {% endfor %}
    UPDATE_DELAYED_GCODE ID=WM_TOOL_LEDS DURATION=2
