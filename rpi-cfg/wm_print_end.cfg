# wm_print_end.cfg  -  run PRINT_END when a print finishes
#
# The original WonderMaker screen board ran PRINT_END itself when a print reached its end, so the slicer end G-code
# is only the comment ";PRINT_END" (a semicolon makes it a comment, Klipper skips it). Without the screen board nothing
# runs it: the tool head stays over the print, the heaters stay on and the motors stay locked.
# This watcher does what the screen board did: when the print state is "complete" and PRINT_END has not run yet
# (START_PRINT.print_body_ready is still True), it runs PRINT_END once. A G-code file that already calls PRINT_END
# (without the semicolon) is not run twice.
[delayed_gcode WM_PRINT_END_WATCH]
initial_duration: 5
gcode:
    {% if printer.print_stats.state == "complete" and printer["gcode_macro START_PRINT"].print_body_ready %}
        RESPOND MSG="Print finished: running PRINT_END (the slicer end G-code is only a comment)"
        PRINT_END
    {% endif %}
    UPDATE_DELAYED_GCODE ID=WM_PRINT_END_WATCH DURATION=2
