# wm_calibration.cfg  -  calibration macros for the Raspberry Pi (not part of WonderMaker's files)
#
# These macros do from Fluidd what the buttons in the WonderMaker screen app do:
#   screen: General > Maintenance             Pi macro
#   Bed Leveling                              WM_BED_LEVELING
#   Vibration Compensation                    WM_VIBRATION_COMP
#   Nozzle Temperature Calibration            WM_NOZZLE_TEMP_CAL
#   Extruder Offsets Calibration              WM_OFFSETS_RAPID  or  WM_OFFSETS_ACCURATE
#   PROBE_CALIBRATE                           WM_PROBE_CALIBRATE
#   Heated bed PID                            WM_BED_PID  (the app has no button for it)
#   one click, hands-off                      WM_FULL_CALIBRATION   (bed mesh, tool offsets, shaper, bed PID, hotend PID; Z height is offered at the end)
#
# They call WonderMaker's own macros (G29, CALIBRATE_OFFSET_ALL_*, PROBE_CALIBRATE, ...), so they need the factory
# macros.cfg and offset_calibrate.cfg from this repository (or from a WonderMaker release) to be installed too.
#
# Safety, in every macro:
#   - refuses to start while a print is running or paused, or while any heater has a target above 0
#   - asks you to confirm in Fluidd first (a window with Start / Cancel). Stay at the printer.
#   - turns the heaters off when it ends. WM_CAL_STOP does that on demand.
#   - SAVE_CONFIG restarts Klipper. Macros that change [bed_mesh] / [input_shaper] / PID values save at the end;
#     WM_FULL_CALIBRATION saves once, after its last stage, when you click Save and Restart.
#
# Not included on purpose: Feed & Discharge (it needs the nozzle removed and your hands on the printer).
# Nozzle Type and Extruder Setup have their own file, wm_nozzle.cfg: WM_NOZZLE_TYPE, WM_EXTRUDER_SETUP and WM_NOZZLE_CHANGE.
# Printer must be Ready. The app's own G-code sequences were read from WonderMaker's screen app; see rpi-cfg/README.md.

# ------------------------------------------------------------------ helpers

[gcode_macro WM_CAL_HELP]
description: List the Pi calibration macros
gcode:
    RESPOND MSG="WM_BED_LEVELING     - 49 point bed mesh (app: Bed Leveling)"
    RESPOND MSG="WM_PROBE_CALIBRATE  - Z height, with the bed warm. You adjust with TESTZ then ACCEPT"
    RESPOND MSG="WM_OFFSETS_RAPID / WM_OFFSETS_ACCURATE [TEMP=220] - offsets of all tool heads (app: Extruder Offsets Calibration)"
    RESPOND MSG="WM_VIBRATION_COMP   - input shaper (app: Vibration Compensation)"
    RESPOND MSG="WM_BED_PID [TARGET=60] - PID tuning of the heated bed"
    RESPOND MSG="WM_NOZZLE_TEMP_CAL T=0 TARGET=220 - hotend PID, only if that heater uses control: pid"
    RESPOND MSG="WM_FULL_CALIBRATION - one click: explains it in a window, then runs everything hands-off and saves once"
    RESPOND MSG="WM_NOZZLE_TYPE      - nozzle material and diameter of a tool head (app: Nozzle Type, file wm_nozzle.cfg)"
    RESPOND MSG="WM_EXTRUDER_SETUP   - match the tool heads to their docks and fix the CAN ids (app: Extruder Setup > Set Up)"
    RESPOND MSG="WM_NOZZLE_CHANGE    - release the tool heads to change nozzles. WM_NOZZLE_CHANGE_END to finish (Pi only)"
    RESPOND MSG="WM_CAL_STOP         - heaters and fan off"
    RESPOND MSG="WM_ZOFFSET_UP / WM_ZOFFSET_DOWN [STEP=0.025] - live Z offset, like the app buttons (not saved)"

[gcode_macro WM_CAL_STOP]
description: Heaters and fan off (use after an interrupted calibration)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    TURN_OFF_HEATERS
    M106 S0
    RESPOND MSG="Heaters and fan are off."

[gcode_macro _WM_PROMPT_CLOSE]
description: Close the Fluidd / screen window, then show MSG (used by the window buttons)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if params.MSG is defined %}
        M118 {params.MSG}
    {% endif %}

[gcode_macro _WM_SAVE]
description: Close the Fluidd / screen window, then SAVE_CONFIG (Klipper restarts)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SAVE_CONFIG

[gcode_macro _WM_FAIL]
description: Stop a macro with an error AFTER its window was closed (action_raise_error inside the macro text runs before any line of it)
gcode:
    {action_raise_error(params.MSG|default("Calibration stopped."))}

[gcode_macro _WM_CAL_PRECHECK]
description: Stop unless the printer is idle and every heater is off (ALLOW_BED=1 lets the bed be warm)
gcode:
    # Fluidd closes its own window when a button is pressed, the screen's window does not: tell it to close too.
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set allow_bed = params.ALLOW_BED|default(0)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        _WM_FAIL MSG="{"A print is running or paused. Calibration not started."}"
    {% endif %}
    {% if printer.save_variables.variables.is_nozzle_setting|default(0)|int == 1 %}
        _WM_FAIL MSG="{"Extruder Setup or a nozzle change is still on (is_nozzle_setting = 1): the printer cannot tell that a tool is missing. Put the tools in their docks and run WM_NOZZLE_CHANGE_END, then start again."}"
    {% endif %}
    {% for h in printer.heaters.available_heaters %}
        {% if printer[h].target|float > 0 and not (allow_bed == 1 and h == 'heater_bed') %}
            _WM_FAIL MSG="{"%s has a target of %s C. Turn it off first (WM_CAL_STOP), then start again." % (h, printer[h].target)}"
        {% endif %}
    {% endfor %}

[gcode_macro _WM_CAL_ASK]
description: Show the Start / Cancel window in Fluidd for one stage (STAGE=level|probe|offsets|shaper|bedpid|pid)
gcode:
    {% set stage = params.STAGE|default('level') %}
    {% set mode = params.MODE|default('rapid') %}
    {% set t = params.T|default(0)|int %}
    {% if stage == 'level' %}
        {% set title = "Bed Leveling" %}
        {% set text = "Heats the bed to 55 C and a nozzle to 140 C, wipes the nozzle and probes 49 points. Bed screws removed and bed clear?" %}
        {% set go = "WM_BED_LEVELING CONFIRM=1" %}
    {% elif stage == 'probe' %}
        {% set title = "PROBE_CALIBRATE" %}
        {% set text = "Warms the bed, moves to the middle and starts the Z height routine. You then use TESTZ Z=-0.1 and TESTZ Z=+0.05 and so on, and finish with ACCEPT." %}
        {% set go = "WM_PROBE_CALIBRATE CONFIRM=1" %}
    {% elif stage == 'offsets' %}
        {% set title = "Extruder Offsets Calibration (" ~ mode ~ ")" %}
        {% set text = "Calibrates every tool head with the nozzle gauge. Nozzles heat (accurate mode up to 220 C) and tools are picked up and parked. Bed clear?" %}
        {% set go = "WM_OFFSETS_" ~ mode|upper ~ " CONFIRM=1" %}
    {% elif stage == 'shaper' %}
        {% set title = "Vibration Compensation" %}
        {% set text = "The printer shakes the tool head on purpose and measures it. It is loud. Bed clear and nothing loose on the printer?" %}
        {% set go = "WM_VIBRATION_COMP CONFIRM=1" %}
    {% elif stage == 'bedpid' %}
        {% set title = "Bed PID" %}
        {% set text = "Heats the bed up and down several times to tune its PID. Takes several minutes. Plate installed and bed clear?" %}
        {% set go = "WM_BED_PID TARGET=" ~ params.TARGET|default(60)|int ~ " CONFIRM=1" %}
    {% else %}
        {% set title = "Nozzle Temperature Calibration T" ~ t %}
        {% set text = "Heats this hotend to the target with the fan at full and tunes its PID. Stay at the printer." %}
        {% set go = "WM_NOZZLE_TEMP_CAL T=" ~ t ~ " TARGET=" ~ params.TARGET|default(220)|int ~ " CONFIRM=1" %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin {title}"
    RESPOND TYPE=command MSG="action:prompt_text {text}"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Start|{go}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|_WM_PROMPT_CLOSE MSG=Cancelled|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ one macro per app menu item

[gcode_macro WM_BED_LEVELING]
description: App "Bed Leveling": G29 (49 point mesh), then save
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=level
    {% else %}
        RESPOND MSG="Bed leveling started."
        G28
        G29
        TURN_OFF_HEATERS
        {% if save == 1 %}
            RESPOND MSG="Bed leveling done. Saving (Klipper restarts)."
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="Bed leveling done (not saved yet)."
        {% endif %}
    {% endif %}

[gcode_macro WM_PROBE_CALIBRATE]
description: App "PROBE_CALIBRATE": warm the bed, then WonderMaker's PROBE_CALIBRATE; you finish with TESTZ / ACCEPT
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set bed = params.BED|default(60)|int %}
    _WM_CAL_PRECHECK ALLOW_BED=1
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=probe
    {% else %}
        {% if bed > 100 %}
            {action_raise_error("BED=%d is above 100 C. This macro keeps the bed at 100 C or below." % bed)}
        {% endif %}
        RESPOND MSG="Warming the bed to {bed} C, then starting PROBE_CALIBRATE."
        M190 S{bed}
        PROBE_CALIBRATE
        RESPOND MSG="Now adjust with TESTZ Z=-0.1 (or +0.05, -0.025, ...). When the paper test feels right run ACCEPT, then WM_PROBE_DONE."
    {% endif %}

[gcode_macro WM_PROBE_DONE]
description: After ACCEPT: bed off, then save (SAVE=0 to skip the save)
gcode:
    {% set save = params.SAVE|default(1)|int %}
    M140 S0
    {% if save == 1 %}
        RESPOND MSG="Saving (Klipper restarts)."
        SAVE_CONFIG
    {% else %}
        RESPOND MSG="Bed off. Not saved yet."
    {% endif %}

[gcode_macro WM_OFFSETS_RAPID]
description: App "Extruder Offsets Calibration" - Rapid: G28, RAPID_MODE for every tool, PARK_CURRENT_TOOL (like the screen)
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=offsets MODE=rapid
    {% else %}
        RESPOND MSG="Rapid tool offset calibration started."
        G28
        M400
        {% for t in range(count) %}
            RESPOND MSG="Rapid: measuring T{t} ({t + 1} of {count})..."
            RAPID_MODE T={t}
            M400
        {% endfor %}
        PARK_CURRENT_TOOL
        M400
        TURN_OFF_HEATERS
        RESPOND MSG="Tool offsets done. WonderMaker's macros store them in saved_variables."
    {% endif %}

[gcode_macro WM_OFFSETS_ACCURATE]
description: App "Extruder Offsets Calibration" - Accurate (TEMP=220). Per tool NOZZLE_PREPARE, you remove the purged debris and click OK, NOZZLE_CALIBRATE_TOOL_OFFSET; then RAPID_MODE for every tool
gcode:
    # The same order as the screen app (read from its code). Klipper has no "wait for a button", so the macro ends
    # after preparing a tool and shows a window; its OK button runs this macro again with STEP=clean for that tool.
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set step = params.STEP|default('')|lower %}
    {% set n = params.N|default(0)|int %}
    {% set temp = params.TEMP|default(220)|int %}
    {% set count = printer.save_variables.variables.thr_number|default(4)|int %}
    {% set do_prep = -1 %}
    {% set do_rapid = 0 %}
    {% if temp < 180 or temp > 260 %}
        _WM_FAIL MSG="{"TEMP=%d is outside 180 to 260 C." % temp}"
    {% endif %}
    {% if step == '' %}
        _WM_CAL_PRECHECK
        {% if confirm != 1 %}
            _WM_CAL_ASK STAGE=offsets MODE=accurate
        {% else %}
            RESPOND MSG="Accurate tool offset calibration started."
            G28
            M400
            {% set do_prep = 0 %}
        {% endif %}
    {% elif step == 'clean' %}
        {% if printer.print_stats.state in ['printing', 'paused'] %}
            _WM_FAIL MSG="{"A print is running or paused. Calibration not continued."}"
        {% endif %}
        NOZZLE_CALIBRATE_TOOL_OFFSET T={n}
        M400
        {% if n + 1 < count %}
            {% set do_prep = n + 1 %}
        {% else %}
            {% set do_rapid = 1 %}
        {% endif %}
    {% else %}
        _WM_FAIL MSG="{"STEP must be empty or clean."}"
    {% endif %}
    {% if do_prep >= 0 %}
        RESPOND MSG="Accurate: preparing T{do_prep} ({do_prep + 1} of {count})..."
        NOZZLE_PREPARE S={temp} T={do_prep}
        M400
        RESPOND TYPE=command MSG="action:prompt_begin Tool head T{do_prep}"
        RESPOND TYPE=command MSG="action:prompt_text Before clicking 'OK' to continue, ensure the button-like purged debris has been manually removed from the nozzle tip."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button OK|WM_OFFSETS_ACCURATE STEP=clean N={do_prep} TEMP={temp}|primary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|WM_CAL_STOP|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif do_rapid == 1 %}
        {% for t in range(count) %}
            RESPOND MSG="Accurate: measuring T{t} ({t + 1} of {count})..."
            RAPID_MODE T={t}
            M400
        {% endfor %}
        PARK_CURRENT_TOOL
        M400
        TURN_OFF_HEATERS
        RESPOND MSG="Tool offsets done. WonderMaker's macros store them in saved_variables."
    {% endif %}

[gcode_macro WM_VIBRATION_COMP]
description: App "Vibration Compensation": input shaper test (needs the lis2dw accelerometer on the EX_T board)
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=shaper
    {% else %}
        RESPOND MSG="Vibration compensation started."
        G28
        M400
        COLLISION_DETECT_DISABLE
        SHAPER_CALIBRATE
        {% if save == 1 %}
            RESPOND MSG="Vibration compensation done. Saving (Klipper restarts)."
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="Vibration compensation done (not saved yet)."
        {% endif %}
    {% endif %}

[gcode_macro WM_NOZZLE_TEMP_CAL]
description: App "Nozzle Temperature Calibration": PID_CALIBRATE for one hotend (T=0..3, TARGET=220). Only for heaters with control: pid
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    {% set t = params.T|default(0)|int %}
    {% set target = params.TARGET|default(220)|int %}
    {% set heater = "extruder" if t == 0 else "extruder%d" % t %}
    {% if heater not in printer.heaters.available_heaters %}
        {action_raise_error("There is no heater named %s (T=%d)." % (heater, t))}
    {% endif %}
    {% if target < 150 or target > 260 %}
        {action_raise_error("TARGET=%d is outside 150 to 260 C. Choose a value in that range." % target)}
    {% endif %}
    {% if printer.configfile.settings[heater].control|default('watermark') != 'pid' %}
        {action_raise_error("%s uses control: %s. PID tuning has no effect unless its section in printer.cfg says control: pid." % (heater, printer.configfile.settings[heater].control|default('watermark')))}
    {% endif %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=pid T={t} TARGET={target}
    {% else %}
        RESPOND MSG="PID tuning of {heater} at {target} C started."
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        G1 X150 Y150 F6000
        M106 S255
        PID_CALIBRATE HEATER={heater} TARGET={target}
        M106 S0
        TURN_OFF_HEATERS
        {% if save == 1 %}
            RESPOND MSG="PID tuning done. Saving (Klipper restarts)."
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="PID tuning done (not saved yet)."
        {% endif %}
    {% endif %}

[gcode_macro WM_BED_PID]
description: Heated bed PID (PID_CALIBRATE HEATER=heater_bed). TARGET=60 (40 to 110). Only if the bed uses control: pid
gcode:
    {% set confirm = params.CONFIRM|default(0)|int %}
    {% set save = params.SAVE|default(1)|int %}
    {% set target = params.TARGET|default(60)|int %}
    {% if 'heater_bed' not in printer.heaters.available_heaters %}
        {action_raise_error("There is no heater_bed.")}
    {% endif %}
    {% if target < 40 or target > 110 %}
        {action_raise_error("TARGET=%d is outside 40 to 110 C. Choose a value in that range." % target)}
    {% endif %}
    {% if printer.configfile.settings['heater_bed'].control|default('watermark') != 'pid' %}
        {action_raise_error("heater_bed uses control: %s. PID tuning has no effect unless its section in printer.cfg says control: pid." % printer.configfile.settings['heater_bed'].control|default('watermark'))}
    {% endif %}
    _WM_CAL_PRECHECK
    {% if confirm != 1 %}
        _WM_CAL_ASK STAGE=bedpid TARGET={target}
    {% else %}
        RESPOND MSG="Bed PID tuning at {target} C started. It takes several minutes."
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        PID_CALIBRATE HEATER=heater_bed TARGET={target}
        TURN_OFF_HEATERS
        {% if save == 1 %}
            RESPOND MSG="Bed PID tuning done. Saving (Klipper restarts)."
            SAVE_CONFIG
        {% else %}
            RESPOND MSG="Bed PID tuning done (not saved yet)."
        {% endif %}
    {% endif %}

# ------------------------------------------------------------------ WM_FULL_CALIBRATION (hands-off)

[gcode_macro WM_FULL_CALIBRATION]
description: One click calibration of the Pi: bed mesh, tool offsets, input shaper, hotend PID. Explains it in a Fluidd window first
gcode:
    _WM_CAL_PRECHECK
    {% set pid_ok = [] %}
    {% for t in range(4) %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% if hn in printer.heaters.available_heaters and printer.configfile.settings[hn].control|default('watermark') == 'pid' %}
            {% set _ = pid_ok.append(t) %}
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Full Calibration"
    RESPOND TYPE=command MSG="action:prompt_text This runs the calibrations your printer needs after a new Raspberry Pi, new hardware or a move. It runs by itself and saves once at the end."
    RESPOND TYPE=command MSG="action:prompt_text What it runs, in this order: 1) Bed leveling: heats the bed to 55 C and a nozzle to 140 C, wipes, probes 49 points. 2) Extruder offsets (rapid): calibrates every tool head. 3) Vibration compensation: input shaping with the accelerometer, the printer shakes loudly. 4) Bed PID: tunes the heated bed at 60 C. {'5) Hotend PID: tunes the hotends that use control pid.' if pid_ok|length > 0 else '5) Hotend PID: skipped, your hotends use control watermark (fix: ./installer.sh --pid-cfg).'}"
    RESPOND TYPE=command MSG="action:prompt_text Before you start: no print running, plate installed and clean, bed clear of tools, nozzles clean. Do not touch or bump the printer, and keep the door and lid closed. Heaters turn on by themselves, so stay nearby."
    RESPOND TYPE=command MSG="action:prompt_text It takes roughly 55 to 80 minutes. Nothing is saved until the end: a window then asks Save and Restart, which restarts Klipper. If you do not save, the results are lost at the next restart. Z height (PROBE_CALIBRATE) needs you at the printer, so it is offered at the end."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Start Calibration|_WM_FULL_CALIBRATION|primary"
    RESPOND TYPE=command MSG="action:prompt_button Stop heaters|WM_CAL_STOP|error"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _WM_FULL_CALIBRATION]
description: The work of WM_FULL_CALIBRATION (use WM_FULL_CALIBRATION instead, it asks first)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _WM_CAL_PRECHECK
    RESPOND MSG="Full calibration - 1 of 5: bed leveling"
    WM_BED_LEVELING CONFIRM=1 SAVE=0
    RESPOND MSG="Full calibration - 2 of 5: extruder offsets (rapid)"
    WM_OFFSETS_RAPID CONFIRM=1
    RESPOND MSG="Full calibration - 3 of 5: vibration compensation"
    WM_VIBRATION_COMP CONFIRM=1 SAVE=0
    RESPOND MSG="Full calibration - 4 of 5: bed PID"
    {% if printer.configfile.settings['heater_bed'].control|default('watermark') == 'pid' %}
        WM_BED_PID CONFIRM=1 SAVE=0
    {% else %}
        RESPOND MSG="Full calibration - bed PID skipped: the bed uses control watermark."
    {% endif %}
    RESPOND MSG="Full calibration - 5 of 5: hotend PID"
    {% set done = [] %}
    {% for t in range(4) %}
        {% set hn = "extruder" if t == 0 else "extruder%d" % t %}
        {% if hn in printer.heaters.available_heaters and printer.configfile.settings[hn].control|default('watermark') == 'pid' %}
            WM_NOZZLE_TEMP_CAL T={t} CONFIRM=1 SAVE=0
            {% set _ = done.append(t) %}
        {% endif %}
    {% endfor %}
    {% if done|length == 0 %}
        RESPOND MSG="Full calibration - hotend PID skipped: the hotends use control watermark."
    {% endif %}
    TURN_OFF_HEATERS
    M106 S0
    RESPOND MSG="------------- Full Calibration Complete! -------------"
    _WM_FULL_CALIBRATION_DONE

[gcode_macro _WM_FULL_CALIBRATION_DONE]
description: Window shown when WM_FULL_CALIBRATION has finished (Save and Restart / probe calibration)
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Full Calibration Complete"
    RESPOND TYPE=command MSG="action:prompt_text Calibration is complete. The bed mesh, input shaper and PID values are saved when you press Save and Restart. Klipper then restarts. The tool offsets are already stored by WonderMaker's macros."
    RESPOND TYPE=command MSG="action:prompt_text Z height is not part of the full calibration. After the restart run WM_PROBE_CALIBRATE with the PEI plate installed."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Save and Restart|_WM_SAVE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Not now|_WM_PROMPT_CLOSE MSG=Not saved. Run SAVE_CONFIG to keep the results.|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

# ------------------------------------------------------------------ live Z offset (the app's + and - buttons; not saved)

[gcode_macro WM_ZOFFSET_UP]
description: Raise the live Z offset by STEP (default 0.025 mm). Same as the app's + button; not saved
gcode:
    {% set step = params.STEP|default(0.025)|float %}
    SET_GCODE_OFFSET Z_ADJUST={step} MOVE=1

[gcode_macro WM_ZOFFSET_DOWN]
description: Lower the live Z offset by STEP (default 0.025 mm). Same as the app's - button; not saved
gcode:
    {% set step = params.STEP|default(0.025)|float %}
    SET_GCODE_OFFSET Z_ADJUST=-{step} MOVE=1
